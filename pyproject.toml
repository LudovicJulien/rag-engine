[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[project]
name = "rag-engine"
version = "0.6.0"
description = "Modular Retrieval-Augmented Generation engine built for reusability"

readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"

dependencies = [
    # Data validation & settings
    "pydantic>=2.0",
    "pydantic-settings>=2.0",

    # Embeddings
    "sentence-transformers>=3.0",
    "rank-bm25>=0.2",

    # Vector store
    "qdrant-client>=1.9",

    # LLM
    "ollama>=0.2",
    "huggingface_hub>=0.23",
    "anthropic>=0.40",

    # API
    "fastapi>=0.111",
    "uvicorn>=0.30",

    # Evaluation
    "ragas>=0.1",
    "mlflow>=2.13",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "black>=24.0",
    "isort>=5.13",
    "flake8>=7.0",
    "mypy>=1.10",
    "pre-commit>=3.7",
    "coverage>=7.0",
    "pydantic[mypy]>=2.0",
]

[tool.black]
line-length = 88
target-version = ["py311"]

[tool.isort]
profile = "black"
line_length = 88

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "strict"
addopts = "-p no:cacheprovider"